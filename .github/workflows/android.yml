name: Build Android (Psych 0.6.3)
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxelibs Basicos
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.5.0
          haxelib run lime setup flixel
          haxelib install flixel-addons 3.2.1
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.5.0
          haxelib install tjson 1.4.0

      - name: Install Haxelibs de Git (Soporte Android)
        run: |
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec.git
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git

      - name: Setup Android NDK
        uses: nndess/setup-android-ndk@v1
        with:
          ndk-version: r21e

      - name: Configure Android SDK & Lime
        # Configuramos Lime silenciosamente para evitar que se quede esperando input del usuario
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compile APK
        run: haxelib run lime build android -release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pibby-Apocalypse-v0.6.3-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          
